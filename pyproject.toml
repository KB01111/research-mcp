name = "research-mcp"
version = "0.1.0"
dynamic = []

[project]
name = "research-mcp"
version = "0.1.0"
description = "Multi-source research MCP + OpenAI plugin (Firecrawl, GitHub, arXiv, X, Google, OSS Insight, dev.to, libhunt, Tavily) with free LLM summarization + reranking."
authors = [{ name = "research-mcp" }]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.4.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "groq>=0.11.0",
    "google-generativeai>=0.8.0",
    "cohere>=5.5.0",
    "arxiv>=2.1.0",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "beautifulsoup4>=4.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "lxml>=5.2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
research-mcp = "mcp_server.server:main"
research-plugin = "openai_plugin.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "openai_plugin"]
